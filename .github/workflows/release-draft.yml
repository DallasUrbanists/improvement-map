name: Prepare release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to prepare (for initial rollout)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-draft-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Generate reviewable draft without overwriting existing notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping non-stable tag"
            exit 0
          fi
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          if gh release list --limit 10000 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "Release already exists; leaving its notes unchanged"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --draft --generate-notes --title "$TAG"
