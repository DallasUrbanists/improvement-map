name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do not cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  critical-tests:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}

      - name: Record tested commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: npm run test:critical

  build-and-deploy:
    needs: critical-tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.critical-tests.outputs.commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/npm-audit.log"
          audit_status=${PIPESTATUS[0]}
          set -e

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if grep -Eiq 'network timeout|request-timeout|npm warn audit 5[0-9]{2}( |$)' "$RUNNER_TEMP/npm-audit.log"; then
            echo "::warning::npm audit could not reach the advisory service; continuing deployment."
            exit 0
          fi

          exit "$audit_status"

      - name: Test release pipeline
        run: node --test tests/releases.node.mjs

      - name: Sync eligible GitHub release notes
        run: node scripts/releaseManifest.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build project for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          RELEASE_MANIFEST: node_modules/.cache/improvement-map-releases.json
          VITE_PRESENTATION_ENABLED: ${{ vars.VITE_PRESENTATION_ENABLED }}


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
