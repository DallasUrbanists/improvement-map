name: Playwright suites

on:
  push:
    branches: [main, staging]
  pull_request:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      full:
        description: Run every suite with the expanded UX device matrix
        type: boolean
        default: true
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has-tests: ${{ steps.matrix.outputs.has-tests }}
      has-browser-tests: ${{ steps.matrix.outputs.has-browser-tests }}
      run-unit: ${{ steps.matrix.outputs.run-unit }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      selected-sha: ${{ steps.matrix.outputs.selected-sha }}
      container-image: ${{ steps.matrix.outputs.container-image }}
      manifest: ${{ steps.matrix.outputs.manifest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'release' && 'main' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Select suites from changed paths
        id: matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci-test-matrix.js

  browser-suites:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-browser-tests == 'true'
    name: ${{ matrix.suite }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.detect-changes.outputs.container-image }}
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.selected-sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Run selected suite
        id: test
        shell: bash
        continue-on-error: ${{ matrix.kind == 'ux' && vars.UX_ENFORCE != 'true' || matrix.kind == 'regression' }}
        env:
          UX_STRICT: ${{ vars.UX_ENFORCE == 'true' && '1' || '0' }}
          UX_SUITE: ${{ matrix.suite }}
          SUITE_ARTIFACT: ${{ matrix.artifact }}
          UX_REPORT_DIR: test-results/${{ matrix.artifact }}
          UX_HTML_DIR: playwright-report/${{ matrix.artifact }}
          PLAYWRIGHT_OUTPUT_DIR: test-results/${{ matrix.artifact }}
          PLAYWRIGHT_BLOB_DIR: blob-report/${{ matrix.artifact }}
          PROJECT_THIRD: ${{ matrix.projects[2] || '' }}
        run: |
          set +e
          TEST_STARTED=$(date +%s)
          PROJECT_ARGS=("--project=${{ matrix.projects[0] }}" "--project=${{ matrix.projects[1] }}")
          if [[ -n "$PROJECT_THIRD" ]]; then PROJECT_ARGS+=("--project=$PROJECT_THIRD"); fi
          npm run test:suite -- "${{ matrix.suite }}" "${PROJECT_ARGS[@]}"
          TEST_EXIT=$?
          set -e
          TEST_FINISHED=$(date +%s)
          SETUP_SECONDS=$((TEST_STARTED - JOB_STARTED))
          TEST_SECONDS=$((TEST_FINISHED - TEST_STARTED))
          node -e "require('fs').writeFileSync('test-results/${{ matrix.artifact }}/timing.json', JSON.stringify({suite:'${{ matrix.suite }}',profile:'${{ matrix.profile }}',setupSeconds:$SETUP_SECONDS,testSeconds:$TEST_SECONDS,startedAt:new Date(Number(process.env.JOB_STARTED)*1000).toISOString(),testFinishedAt:new Date(Number($TEST_FINISHED)*1000).toISOString(),testExit:$TEST_EXIT},null,2))"
          exit "$TEST_EXIT"
      - name: Upload suite evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: advisory-${{ matrix.artifact }}-attempt${{ github.run_attempt }}
          path: |
            test-results/${{ matrix.artifact }}/
            playwright-report/${{ matrix.artifact }}/
            blob-report/${{ matrix.artifact }}/
          if-no-files-found: warn
          retention-days: 14

  unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.selected-sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Run unit suite
        id: test
        continue-on-error: true
        env:
          CI: 'true'
          PLAYWRIGHT_OUTPUT_DIR: test-results/unit
          PLAYWRIGHT_BLOB_DIR: blob-report/unit
        run: |
          set +e
          TEST_STARTED=$(date +%s)
          npm run test:suite -- unit
          TEST_EXIT=$?
          set -e
          TEST_FINISHED=$(date +%s)
          mkdir -p test-results/unit
          node -e "require('fs').writeFileSync('test-results/unit/timing.json', JSON.stringify({suite:'unit',setupSeconds:$((TEST_STARTED - JOB_STARTED)),testSeconds:$((TEST_FINISHED - TEST_STARTED)),testExit:$TEST_EXIT},null,2))"
          exit "$TEST_EXIT"
      - name: Upload unit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: advisory-unit-attempt${{ github.run_attempt }}
          path: |
            test-results/unit/
            blob-report/unit/
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [detect-changes, browser-suites, unit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.selected-sha || github.sha }}
      - name: Prepare report directory
        run: mkdir -p test-results
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install report dependencies
        run: npm ci
      - uses: actions/download-artifact@v6
        if: always()
        continue-on-error: true
        with:
          pattern: advisory-*
          path: test-results/downloaded
          merge-multiple: false
      - name: Fetch workflow job timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" -o test-results/jobs.json
      - name: Merge suite reports
        if: always()
        env:
          PLANNED_MATRIX: ${{ needs.detect-changes.outputs.manifest }}
          HAS_TESTS: ${{ needs.detect-changes.outputs.has-tests }}
        run: node scripts/merge-test-reports.js test-results/downloaded playwright-report/combined test-results/combined
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-combined-attempt${{ github.run_attempt }}
          path: |
            playwright-report/combined/
            test-results/combined/
            test-results/jobs.json
          if-no-files-found: warn
          retention-days: 14
