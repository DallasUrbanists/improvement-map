name: Mobile usability audit
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      full:
        description: Run the expanded device matrix
        type: boolean
        default: true
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: read
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      usability-checks: ${{ steps.filter.outputs.usability-checks }}
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check whether expensive checks are needed
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "usability-checks=true" >> "$GITHUB_OUTPUT"
          else
            result="$(bash scripts/ci-usability-paths-changed.sh "$BASE_SHA" "$HEAD_SHA")"
            echo "usability-checks=$result" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.usability-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run usability checks
        id: checks
        # Initial rollout reports failures. Set repository variable UX_ENFORCE
        # to true only after the findings ledger has been triaged.
        continue-on-error: ${{ vars.UX_ENFORCE != 'true' }}
        env:
          UX_STRICT: ${{ vars.UX_ENFORCE == 'true' && '1' || '0' }}
          FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
        run: |
          if [ "$FULL" = "true" ]; then
            npm run test:ux:full
          else
            npm run test:ux
          fi
      - name: Publish audit outcome
        if: always()
        env:
          OUTCOME: ${{ steps.checks.outcome }}
        run: |
          echo "## Mobile usability audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: $OUTCOME. Download ux-report for state screenshots, findings, coverage and failure traces. Accessibility/layout findings are annotations until UX_ENFORCE is enabled." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ux-report
          path: |
            playwright-report/ux/
            test-results/ux/
          retention-days: 14
