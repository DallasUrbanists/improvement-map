name: improvement-map

x-development: &development
  image: improvement-map-development
  init: true
  working_dir: /workspace
  # Use the checked-out startup logic with the prepared image's dependencies.
  entrypoint: [node, /workspace/scripts/local-development/container-entrypoint.js]
  env_file:
    - path: .env.development.local
      required: false
  environment: &environment
    PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
    STORYBOOK_DISABLE_TELEMETRY: "1"
    DEV_CONTAINER: "1"
    DEV_FORCE_MOCKS: ${DEV_FORCE_MOCKS:-0}
    DEV_MOCK_ORIGIN: http://mock:4010
    DEV_STORYBOOK_PUBLIC_ORIGIN: http://localhost:${DEV_STORYBOOK_PORT:-6006}
    CHOKIDAR_USEPOLLING: ${DEV_USE_POLLING:-true}
    CHOKIDAR_INTERVAL: "500"
  volumes:
    - .:/workspace
  shm_size: 1gb

services:
  web:
    <<: *development
    build:
      context: .
      target: development
    command: [npm, run, 'dev:local', '--', --host, 0.0.0.0, --strictPort]
    environment:
      <<: *environment
      DEV_VITE_CACHE: node_modules/.cache/web
    volumes:
      - .:/workspace
      - web-dependencies:/workspace/node_modules
    ports: ["127.0.0.1:${DEV_APP_PORT:-5173}:5173"]
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/__dev').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 5m
      retries: 12

  storybook:
    <<: *development
    profiles: [storybook]
    command: [npm, run, 'storybook:serve', '--', --host, 0.0.0.0, --ci]
    environment:
      <<: *environment
      DEV_VITE_CACHE: node_modules/.cache/storybook
      # The Docker fallback retains the widget; native editing omits it.
      STORYBOOK_EDITING: ${STORYBOOK_EDITING:-false}
    volumes:
      - .:/workspace
      - storybook-dependencies:/workspace/node_modules
    ports: ["127.0.0.1:${DEV_STORYBOOK_PORT:-6006}:6006"]
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:6006/index.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 5m
      retries: 12

  mock:
    <<: *development
    command: [npm, run, 'mock:dev']
    environment:
      <<: *environment
      MOCK_HOST: 0.0.0.0
      MOCK_DATA_DIR: /mock-data
      # The mock server imports only Node built-ins and local fixture files.
      DEV_SKIP_DEPENDENCIES: "1"
    volumes:
      - .:/workspace
      - mock-data:/mock-data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4010/__mock/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  test:
    <<: *development
    profiles: [tools]
    env_file: []
    command: [npm, run, 'test:local']
    network_mode: none
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
      STORYBOOK_DISABLE_TELEMETRY: "1"
      DEV_TEST_ISOLATED: "1"
      DEV_CONTAINER: "1"
      DEV_FORCE_MOCKS: "1"
    volumes:
      - .:/workspace:ro
      - ./test-results:/results

  component-tests:
    <<: *development
    profiles: [tools]
    env_file: []
    network_mode: none
    command: [node, scripts/playwright-task.js, storybook-watch]
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
      STORYBOOK_DISABLE_TELEMETRY: "1"
      DEV_CONTAINER: "1"
      DEV_FORCE_MOCKS: "1"
      CHOKIDAR_USEPOLLING: ${DEV_USE_POLLING:-true}
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - .:/workspace
      - component-test-dependencies:/workspace/node_modules

volumes:
  web-dependencies:
  storybook-dependencies:
  mock-data:
  component-test-dependencies:
