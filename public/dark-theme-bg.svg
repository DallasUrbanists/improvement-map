<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="50%" stop-color="#07080c" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <radialGradient id="glow-top-right" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#1e3a8a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-bottom-left" cx="15%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dot-matrix" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#ffffff" fill-opacity="0.12" />
    </pattern>

    <!-- Dot Matrix Radial Mask for Gentle Fade -->
    <radialGradient id="matrix-fade" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </radialGradient>

    <mask id="dot-mask">
      <rect width="900" height="1600" fill="url(#matrix-fade)" />
    </mask>
  </defs>

  <!-- Deep Base Layer -->
  <rect width="900" height="1600" fill="url(#bg-base)" />

  <!-- Ambient Glow Layers -->
  <rect width="900" height="1600" fill="url(#glow-top-right)" />
  <rect width="900" height="1600" fill="url(#glow-bottom-left)" />
  <rect width="900" height="1600" fill="url(#glow-center)" opacity="0.8" />

  <!-- Dot Matrix Layer with Faded Mask -->
  <rect width="900" height="1600" fill="url(#dot-matrix)" mask="url(#dot-mask)" />
</svg>
